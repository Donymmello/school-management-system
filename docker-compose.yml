name: school-management-system

services:
  school:
    image: postgres:16-alpine
    container_name: sms_postgres
    env_file:
      - ./backend/.env
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - sms_postgres_data:/var/lib/postgresql/data
    # sem isso, "depends_on" só espera o container do postgres existir, não o
    # servidor estar pronto pra aceitar conexão (no primeiro boot o initdb cria
    # o cluster antes de abrir a porta)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 30

  api_backend:
    build: ./backend
    container_name: sms_backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/upload:/app/upload
      - ./backend/upload/comprovativos:/app/upload/comprovativos
    depends_on:
      school:
        condition: service_healthy
    # se cair por qualquer motivo transitório (ex: postgres reiniciar), volta sozinho
    restart: unless-stopped

  web_frontend:
    build: ./frontend
    container_name: sms_frontend
    ports:
      - "5173:5173"
    environment:
      # dentro da rede do compose o backend não é "localhost", é o nome do serviço
      VITE_API_PROXY_TARGET: http://api_backend:5000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api_backend

volumes:
  sms_postgres_data:
