name: school-management-system

services:
  school:
    image: mysql:8.0
    container_name: sms_mysql
    env_file:
      - ./backend/.env
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3306:3306"
    volumes:
      - sms_mysql_data:/var/lib/mysql
    # sem isso, "depends_on" só espera o container do mysql existir, não o
    # servidor estar pronto pra aceitar conexão (o primeiro boot demora minutos
    # inicializando os arquivos do banco)
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASS}"]
      interval: 5s
      timeout: 5s
      retries: 30

  api_backend:
    build: ./backend
    container_name: sms_backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/upload:/app/upload
      - ./backend/upload/comprovativos:/app/upload/comprovativos
    depends_on:
      school:
        condition: service_healthy
    # se cair por qualquer motivo transitório (ex: mysql reiniciar), volta sozinho
    restart: unless-stopped

  web_frontend:
    build: ./frontend
    container_name: sms_frontend
    ports:
      - "5173:5173"
    environment:
      # dentro da rede do compose o backend não é "localhost", é o nome do serviço
      VITE_API_PROXY_TARGET: http://api_backend:5000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api_backend

volumes:
  sms_mysql_data: